pluginGroup = com.hql
pluginName = Deploy to Host
pluginVersion = 1.0.1
pluginSinceBuild = 262

# 目标 IDE 版本，供 intellijIdea() 与插件校验共用，避免两处版本号写错
pluginIdeVersion = 2026.2

# 不设置 untilBuild，保持对未来版本的开放兼容性
platformUntilBuild =

# 本机 JAVA_HOME 为 JDK 8，Gradle 9 需要 17+，此处指定运行 Gradle 的 JVM；
# 编译用 JDK 由 build.gradle.kts 的 toolchain(25) 单独指定
org.gradle.java.home = C:/Program Files/Java/jdk-17

org.gradle.jvmargs = -Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.caching = true
org.gradle.configuration-cache = false
kotlin.stdlib.default.dependency = false
